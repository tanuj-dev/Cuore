buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Set REACT_NATIVE_NODE_MODULES_DIR on rootProject to avoid node execution in react-native packages
// This prevents the "Cannot find node" error when Android Studio doesn't have node in PATH
// Must be set before any plugins are applied
ext.REACT_NATIVE_NODE_MODULES_DIR = file("${rootDir}/../node_modules/react-native")
ext.REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = file("${rootDir}/../node_modules/react-native-worklets")

apply plugin: "com.facebook.react.rootproject"
